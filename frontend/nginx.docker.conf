# Конфиг nginx внутри контейнера. Прод-конфиг сервера — deploy/nginx.prod.conf
# в корне репозитория.

# Вход и регистрация — единственное, что стоит перебирать. argon2 и так
# медленный, но лимит дешевле: 30 попыток в минуту с одного адреса,
# первые 10 без задержки — человек столько не промахнётся, перебор столько
# не наберёт.
# За nginx'ом хоста remote_addr — это адрес самого прокси, и лимит лёг бы
# на всех читателей разом. Настоящий адрес берётся из X-Real-IP, но только
# если его прислали из частной сети: снаружи заголовок не подделать.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=auth:1m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Книга до 64 МБ, дефолтный лимит nginx в 1 МБ её не пропустит.
    client_max_body_size 64m;

    # Разбор большого pdf на сервере — не мгновенный; дефолтные 60с на ответ
    # обрубили бы загрузку, которая на самом деле идёт.
    proxy_read_timeout 300s;

    # Книга для читалки — JSON на мегабайты, бандл — 300 КБ: без сжатия
    # это в 3–5 раз больше трафика на каждое открытие.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml;
    gzip_min_length 1k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Адрес api берётся через resolver docker'а, а не при старте: иначе
    # пересозданный контейнер api получает новый ip, а nginx до своего
    # рестарта шлёт запросы на старый и отвечает 502.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:4444;

    location = /api/login        { limit_req zone=auth burst=10 nodelay; proxy_pass $api/login; }
    location = /api/registration { limit_req zone=auth burst=10 nodelay; proxy_pass $api/registration; }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    # Файлы с хэшем в имени не меняются никогда — кэшировать навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # SPA: все остальные пути отдают index.html, роутинг разбирает react.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
