services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leser
      POSTGRES_PASSWORD: leser
      POSTGRES_DB: leser
    # Порт наружу — чтобы ходить psql'ем и запускать api локально через cargo run.
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leser"]
      interval: 2s
      retries: 15

  api:
    build: ./api
    ports: ["4444:4444"]
    environment:
      DATABASE_URL: postgres://leser:leser@db:5432/leser
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Фронт ходит через nginx того же origin, так что CORS нужен только
      # для vite dev-сервера на хосте.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Пусто — источник GitHub просто выключен, Gutenberg работает без ключей.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    # 8080 на этой машине занят чужим контейнером, поэтому 8081 и переопределение.
    ports: ["${FRONTEND_PORT:-8081}:80"]
    depends_on: [api]

volumes:
  pgdata:
