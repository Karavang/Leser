# Прод-конфиг leser.cloud. Лежит в репозитории, чтобы правки ходили через git,
# а не только через ssh. Переехал из frontend/nginx.conf; блоки постороннего
# проекта (shetagri.com) выкинуты — им тут не место.
#
# Отличие от того, что стояло раньше: фронт зовёт относительный /api/, поэтому
# location /api/ обязан быть в том же server-блоке, что и статика. Отдельный
# домен api.leser.cloud больше не нужен — один origin, CORS не участвует.

server {
    server_name leser.cloud www.leser.cloud;
    root /var/www/leser;
    index index.html;

    # Книга до 64 МБ, дефолтный лимит nginx в 1 МБ её не пропустит.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:4444/;
    }

    # SPA: все остальные пути отдают index.html, роутинг разбирает react.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;                                                    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/leser.cloud/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leser.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

server {
    if ($host = leser.cloud) {
        return 301 https://$host$request_uri;
    }                                                                  # managed by Certbot

    server_name leser.cloud www.leser.cloud;
    listen 80;
    return 404;                                                        # managed by Certbot
}
