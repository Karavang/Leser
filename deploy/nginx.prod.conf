# Прод-конфиг nginx на самом VPS. Лежит в репозитории, чтобы правки ходили
# через git, а не только через ssh. Ставится в /etc/nginx/sites-available/leser
# и линкуется в sites-enabled; сертификат делает certbot --nginx.
#
# Всё приложение живёт в docker compose и слушает 127.0.0.1:8081
# (FRONTEND_PORT в .env). Здесь только TLS и проксирование: статику,
# /api/ и лимиты уже разбирает nginx внутри контейнера фронта.

server {
    server_name leser.cloud www.leser.cloud;

    # Книга до 64 МБ, дефолтный лимит nginx в 1 МБ её не пропустит.
    client_max_body_size 64m;
    # Разбор большого pdf на сервере не мгновенный.
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;                                                    # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/leser.cloud/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leser.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                   # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot
}

server {
    if ($host = leser.cloud) {
        return 301 https://$host$request_uri;
    }                                                                  # managed by Certbot

    server_name leser.cloud www.leser.cloud;
    listen 80;
    return 404;                                                        # managed by Certbot
}
